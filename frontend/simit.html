<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/car.png">
    <link rel="apple-touch-icon" href="img/vehiamb_icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Consulta SIMIT - Vehiamb</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1>Consulta SIMIT</h1>
                    <p class="page-kicker">Estado de comparendos por placa, historial de consultas y novedades de la flota</p>
                </div>
                <div class="page-header-right">
                    <button type="button" id="actualizarFlotaButton" class="header-action hidden">Actualizar toda la flota</button>
                </div>
            </div>

            <section class="section-card">
                <details class="section-card-collapsible" open>
                <summary class="section-card-head">
                    <h2>Resumen de la flota</h2>
                    <p>Basado en la última consulta registrada de cada vehículo. <span id="simitSyncNote" class="section-card-subnote"></span></p>
                </summary>
                <div class="section-card-body">
                    <div id="simitKpisGrid" class="kpis-grid"></div>

                    <div id="simitRankings" class="simit-rankings"></div>

                    <form id="simitFilterForm" class="doc-filterbar">
                        <div class="doc-filterbar-row">
                            <input type="search" id="filterSimitBusqueda" class="doc-search-input" placeholder="Buscar por placa, marca o modelo">

                            <div class="doc-filter-popover-wrap">
                                <button type="button" class="doc-filter-trigger" id="filterSimitEstadoTrigger">
                                    <span id="filterSimitEstadoTriggerLabel">Estado de cartera</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                </button>
                                <div class="doc-filter-popover hidden" id="filterSimitEstadoPopover">
                                    <button type="button" class="doc-filter-option is-active" data-estado-value="">Todos</button>
                                    <button type="button" class="doc-filter-option" data-estado-value="nunca_consultado">Nunca consultado</button>
                                    <button type="button" class="doc-filter-option" data-estado-value="sin_multas">Sin multas</button>
                                    <button type="button" class="doc-filter-option" data-estado-value="con_multas">Con multas</button>
                                    <button type="button" class="doc-filter-option" data-estado-value="cobro_coactivo">Cobro coactivo</button>
                                    <button type="button" class="doc-filter-option" data-estado-value="acuerdo_pago">Acuerdo de pago</button>
                                    <button type="button" class="doc-filter-option" data-estado-value="desconocido">Desconocido / error</button>
                                </div>
                            </div>

                            <div class="doc-filter-popover-wrap">
                                <button type="button" class="doc-filter-trigger" id="filterSimitConductorTrigger">
                                    <span id="filterSimitConductorTriggerLabel">Conductor</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                </button>
                                <div class="doc-filter-popover hidden" id="filterSimitConductorPopover">
                                    <button type="button" class="doc-filter-option is-active" data-conductor-value="">Todos</button>
                                </div>
                            </div>

                            <div class="doc-filter-popover-wrap">
                                <button type="button" class="doc-filter-trigger" id="filterSimitFechasTrigger">
                                    <span id="filterSimitFechasTriggerLabel">Última consulta</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                </button>
                                <div class="doc-filter-popover doc-filter-popover-dates hidden" id="filterSimitFechasPopover">
                                    <label>Desde<input type="date" id="filterSimitFechaDesde"></label>
                                    <label>Hasta<input type="date" id="filterSimitFechaHasta"></label>
                                </div>
                            </div>

                            <button type="button" id="clearSimitFiltersButton" class="doc-filter-trigger">Limpiar</button>
                        </div>

                        <div class="doc-filterbar-chips hidden" id="simitFilterChips"></div>

                        <span id="simitFilterSummary" class="field-help">Cargando vehículos...</span>
                    </form>

                    <div id="simitFlotaList" class="records-list">
                        <p class="dash-empty">Cargando...</p>
                    </div>
                </div>
                </details>
            </section>

            <div id="loader" class="loader hidden">
                <video src="img/loader.mp4" autoplay loop muted playsinline></video>
            </div>
            <div id="mensaje" class="mensaje hidden"></div>

            <div id="simitDrawerBackdrop" class="drawer-backdrop hidden"></div>
            <aside id="simitDrawer" class="detail-drawer hidden" aria-hidden="true" aria-labelledby="simitDrawerTitle">
                <div class="detail-drawer-head detail-drawer-head-simit">
                    <div class="detail-drawer-head-row">
                        <div>
                            <span class="form-step">Detalle SIMIT</span>
                            <h2 id="simitDrawerTitle">Vehículo</h2>
                            <p id="simitDrawerSubtitle">Comparendos e historial de consultas</p>
                        </div>
                        <button type="button" id="closeSimitDrawer" class="drawer-close" aria-label="Cerrar detalle">×</button>
                    </div>
                    <div class="detail-drawer-actions">
                        <button type="button" id="simitDrawerConsultarButton" class="btn-secondary">Consultar ahora</button>
                        <button type="button" id="simitDrawerPagarButton" class="btn-secondary btn-pagar">Consultar y pagar en SIMIT ↗</button>
                        <button type="button" id="exportSimitPdfButton" class="btn-secondary btn-pdf">Exportar PDF</button>
                        <button type="button" id="exportSimitExcelButton" class="btn-secondary btn-excel">Exportar Excel</button>
                    </div>
                </div>
                <div id="simitDrawerBody" class="detail-drawer-body"></div>
            </aside>
        </main>
    </div>

    <script src="assets/js/shared/auth.js"></script>
    <script src="assets/js/shared/api.js"></script>
    <script src="assets/js/shared/ui.js"></script>
    <script src="assets/js/shared/notificaciones-config.js"></script>
    <script src="assets/js/shared/sidebar.js"></script>
    <script src="assets/js/shared/load-script.js"></script>
    <script src="assets/js/shared/pdf-export.js"></script>
    <script src="assets/js/shared/excel-export.js"></script>
    <script src="assets/js/pages/simit.js"></script>
    <script src="assets/js/pages/simit-export.js"></script>
</body>
</html>
