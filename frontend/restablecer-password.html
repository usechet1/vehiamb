<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/car.png">
    <link rel="apple-touch-icon" href="img/vehiamb_icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Restablecer contraseña - Vehiamb</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
               <img src="img/vehiamb.png" alt="Vehiamb" class="logo-image">
            </div>

            <form id="restablecerPasswordForm" class="login-form">
                <div class="form-group">
                    <label for="restablecerPasswordNueva">Nueva contraseña:</label>
                    <input type="password" id="restablecerPasswordNueva" name="password_nueva" autocomplete="new-password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="restablecerPasswordConfirmar">Confirmar nueva contraseña:</label>
                    <input type="password" id="restablecerPasswordConfirmar" name="password_confirmar" autocomplete="new-password" minlength="6" required>
                </div>

                <button type="submit" class="btn-primary">Restablecer contraseña</button>
            </form>

            <div id="restablecerPasswordMessage" class="mensaje hidden"></div>

            <p class="field-help" style="margin-top: 16px;">
                <a href="login.html">Volver a iniciar sesión</a>
            </p>
        </section>
    </main>

    <script src="assets/js/shared/ui.js"></script>
    <script src="assets/js/shared/auth.js"></script>
    <script src="assets/js/shared/api.js"></script>
    <script src="assets/js/pages/restablecer-password.js"></script>
</body>
</html>
