<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/car.png">
    <link rel="apple-touch-icon" href="img/vehiamb_icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Recuperar contraseña - Vehiamb</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
               <img src="img/vehiamb.png" alt="Vehiamb" class="logo-image">
            </div>

            <p class="field-help" style="margin-bottom: 16px;">
                Escribe tu correo y, si está registrado, te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <form id="olvidePasswordForm" class="login-form">
                <div class="form-group">
                    <label for="olvideEmail">Correo:</label>
                    <input type="email" id="olvideEmail" name="email" placeholder="correo@empresa.com" autocomplete="username" required>
                </div>

                <button type="submit" class="btn-primary">Enviar enlace</button>
            </form>

            <div id="olvidePasswordMessage" class="mensaje hidden"></div>

            <p class="field-help" style="margin-top: 16px;">
                <a href="login.html">Volver a iniciar sesión</a>
            </p>
        </section>
    </main>

    <script src="assets/js/shared/ui.js"></script>
    <script src="assets/js/shared/auth.js"></script>
    <script src="assets/js/shared/api.js"></script>
    <script src="assets/js/pages/olvide-password.js"></script>
</body>
</html>
