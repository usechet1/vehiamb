<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/car.png">
    <link rel="apple-touch-icon" href="img/vehiamb_icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Notificaciones - Vehiamb</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1 id="notifPageTitle">Centro de notificaciones</h1>
                    <p class="page-kicker">Mantenimientos, documentación, incidentes, usuarios y sistema en un solo lugar.</p>
                </div>
            </div>

            <section class="section-card">
                <div class="section-card-body notif-toolbar">
                    <div class="notif-tabs" id="notifTabs">
                        <button type="button" class="notif-tab is-active" data-notif-tab="no_leida">
                            No leídas <span class="notif-tab-count hidden" id="notifTabCountNoLeidas"></span>
                        </button>
                        <button type="button" class="notif-tab" data-notif-tab="">Todas</button>
                    </div>

                    <div class="notif-category-chips hidden" id="notifCategoryChips"></div>

                    <div class="notif-toolbar-row">
                        <input type="search" id="notifSearch" class="doc-search-input" placeholder="Buscar por placa, título, usuario o tipo">

                        <div class="doc-filter-popover-wrap">
                            <button type="button" class="doc-filter-trigger" id="notifFiltrosTrigger">
                                <span>Filtros</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                            </button>
                            <div class="doc-filter-popover notif-filters-popover hidden" id="notifFiltrosPopover">
                                <label>Prioridad
                                    <select id="notifFiltroPrioridad">
                                        <option value="">Todas</option>
                                        <option value="critica">Crítica</option>
                                        <option value="alta">Alta</option>
                                        <option value="media">Media</option>
                                        <option value="informativa">Informativa</option>
                                    </select>
                                </label>
                                <label>Estado
                                    <select id="notifFiltroEstadoExtra">
                                        <option value="">Según la pestaña</option>
                                        <option value="leida">Leídas</option>
                                        <option value="archivada">Archivadas</option>
                                    </select>
                                </label>
                                <label>Vehículo
                                    <select id="notifFiltroVehiculo">
                                        <option value="">Todos</option>
                                    </select>
                                </label>
                                <label>Desde<input type="date" id="notifFechaDesde"></label>
                                <label>Hasta<input type="date" id="notifFechaHasta"></label>
                            </div>
                        </div>

                        <div class="doc-filter-popover-wrap">
                            <button type="button" class="doc-filter-trigger notif-menu-trigger" id="notifMenuTrigger" aria-label="Más acciones">⋮</button>
                            <div class="doc-filter-popover hidden" id="notifMenuPopover">
                                <button type="button" class="doc-filter-option" id="notifMarkAllReadButton">Marcar todas leídas</button>
                                <button type="button" class="doc-filter-option" id="notifDeleteReadButton">Eliminar leídas</button>
                                <button type="button" class="doc-filter-option notif-menu-option--danger" id="notifDeleteAllButton">Eliminar todas</button>
                            </div>
                        </div>
                    </div>

                    <div class="doc-filterbar-chips hidden" id="notifFiltersChips"></div>
                </div>

                <div class="section-card-body notif-list-body">
                    <div id="notifCenterList" class="notif-center-list">
                        <p class="dash-empty">Cargando...</p>
                    </div>
                </div>
            </section>

            <div id="loader" class="loader hidden">
                <video src="img/loader.mp4" autoplay loop muted playsinline></video>
            </div>
            <div id="mensaje" class="mensaje hidden"></div>
        </main>
    </div>

    <script src="assets/js/shared/auth.js"></script>
    <script src="assets/js/shared/api.js"></script>
    <script src="assets/js/shared/ui.js"></script>
    <script src="assets/js/shared/notificaciones-config.js"></script>
    <script src="assets/js/shared/sidebar.js"></script>
    <script src="assets/js/pages/notificaciones.js"></script>
</body>
</html>
