<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/car.png">
    <link rel="apple-touch-icon" href="img/vehiamb_icon.png">
    <link rel="manifest" href="manifest.json">
    <title>Cambia tu contraseña - Vehiamb</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-brand">
               <img src="img/vehiamb.png" alt="Vehiamb" class="logo-image">
            </div>

            <p class="field-help" style="margin-bottom: 16px;">
                Tu administrador te asignó una contraseña temporal. Por seguridad, debes cambiarla antes de continuar.
            </p>

            <form id="cambiarPasswordForm" class="login-form login-form-con-texto">
                <div class="form-group">
                    <label for="passwordActual">Contraseña actual:</label>
                    <input type="password" id="passwordActual" name="password_actual" autocomplete="current-password" required>
                </div>

                <div class="form-group">
                    <label for="passwordNueva">Nueva contraseña:</label>
                    <input type="password" id="passwordNueva" name="password_nueva" autocomplete="new-password" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="passwordConfirmar">Confirmar nueva contraseña:</label>
                    <input type="password" id="passwordConfirmar" name="password_confirmar" autocomplete="new-password" minlength="6" required>
                </div>

                <button type="submit" class="btn-primary">Cambiar contraseña</button>
            </form>

            <div id="cambiarPasswordMessage" class="mensaje hidden"></div>
        </section>
    </main>

    <script src="assets/js/shared/ui.js"></script>
    <script src="assets/js/shared/auth.js"></script>
    <script src="assets/js/shared/api.js"></script>
    <script src="assets/js/pages/cambiar-password.js"></script>
</body>
</html>
